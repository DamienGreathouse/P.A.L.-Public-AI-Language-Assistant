version: "3.9"

# --------------------------------------------------------------------
# All services share a single Docker network called "web"
# --------------------------------------------------------------------
networks:
  web:
    driver: bridge
  dbnet:
    driver: bridge

# --------------------------------------------------------------------
# Backend services
# --------------------------------------------------------------------
services:
  ollama:
    image: ollama/ollama:latest          # pin a tag if you care about stability
    container_name: ollama
    env_file:
      - .env
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - ./ollama_models:/root/.ollama
    restart: unless-stopped
    # --------------------------------------------------------------------
    # *** AMD GPU request – Vulkan/ROCm ***
    # --------------------------------------------------------------------
    device_requests:
      - driver: rocm          # or `amdgpu` if your Docker version prefers that
        count: all
        capabilities: [gpu]
    # Mount the host's DRM device for Vulkan
    devices:
      - /dev/dri:/dev/dri:rw
    networks:
      - web

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    env_file:
      - .env
    volumes:
      - ./openwebui_data:/app/data
      - ./openwebui_logs:/app/logs
    expose:                      # Caddy will reach it on the network
      - "8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}                        # Microsoft OAuth client ID
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}                # Microsoft OAuth client secret
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID}          # Microsoft tenant ID - use 9188040d-6c67-4c5b-b112-36a304b66dad for personal accounts
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}                  # The redirect URI configured in your Microsoft OAuth application. This must be set to <open-webui>/oauth/microsoft/callback
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}                        # Must be set for logout to work properly.
      - ENABLE_ONEDRIVE_INTEGRATION=${ENABLE_ONEDRIVE_INTEGRATION}        # Enable the OneDrive integration feature globally
      - ONEDRIVE_CLIENT_ID_BUSINESS=${ONEDRIVE_CLIENT_ID_BUSINESS}        # The Application (client) ID from your Business App Registration
      - ONEDRIVE_SHAREPOINT_TENANT_ID=${ONEDRIVE_SHAREPOINT_TENANT_ID}    # The Directory (tenant) ID from your Business App Registration
      - ONEDRIVE_SHAREPOINT_URL=${ONEDRIVE_SHAREPOINT_URL}                # The root URL of your SharePoint instance
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - web

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    expose:
      - "5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - web
      - dbnet

  postgres:
    image: pgvector/pgvector-pg15:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
      PGVECTOR_ENABLE_GPU: 1        # enable GPU acceleration inside Postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dbnet
    # --------------------------------------------------------------------
    # *** AMD GPU request – Vulkan/ROCm ***
    # --------------------------------------------------------------------
    device_requests:
      - driver: rocm          # or `amdgpu`
        count: all
        capabilities: [gpu]
    # Mount the DRM device (required for Vulkan access)
    devices:
      - /dev/dri:/dev/dri:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

# --------------------------------------------------------------------
# Caddy reverse‑proxy
# --------------------------------------------------------------------
  caddy:
    image: caddy:2.6.4-alpine
    container_name: caddy
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=America/Los_Angeles   # <-- Pacific time (handles DST automatically)
    depends_on:
      - open-webui
      - n8n
