# docker-compose.yml
version: "3.9"

# ------------------------------------------------------------------
#   All services share a single Docker network called "web"
# ------------------------------------------------------------------
networks:
  web:
    driver: bridge
  dbnet:
    driver: bridge

# ------------------------------------------------------------------
#   Backend services
# ------------------------------------------------------------------
services:
  ollama:
    image: ollama/ollama:latest            # pin a tag if you care about stability
    container_name: ollama
    env_file:
      - .env
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - ./ollama_models:/root/.ollama
    restart: unless-stopped
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    networks:
      - web

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    env_file:
      - .env
    volumes:
      - ./openwebui_data:/app/data
      - ./openwebui_logs:/app/logs
    expose:            # no host port – Caddy will reach it over the network
      - "8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - web

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    expose:
      - "5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - web
      - dbnet
      
  postgres:
    image: pgvector/pgvector-pg15:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
      PGVECTOR_ENABLE_GPU: 1
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dbnet
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

# ------------------------------------------------------------------
#   Caddy reverse‑proxy
# ------------------------------------------------------------------
  caddy:
    image: caddy:2.6.4-alpine            # example pin – use the tag you prefer
    container_name: caddy
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=Etc/UTC
    depends_on:
      - open-webui
      - n8n
